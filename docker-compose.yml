services:
  postgres:
    image: postgres:16-alpine
    container_name: zynetic-postgres
    environment:
      POSTGRES_USER: zynetic
      POSTGRES_PASSWORD: zynetic_secret
      POSTGRES_DB: zynetic_energy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zynetic -d zynetic_energy']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zynetic-app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: zynetic
      POSTGRES_PASSWORD: zynetic_secret
      POSTGRES_DB: zynetic_energy
      PORT: 3000
      NODE_ENV: production
      PG_POOL_MAX: 20
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
